<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML 게임 모음</title>
<style>
  :root{--bg:#0f1116;--panel:#171a22;--line:#262b36;--ink:#e8eaf0;--dim:#9aa3b4;--accent:#5ee1a0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(1000px 600px at 50% -10%,#1b2130,#0f1116 60%);
       color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif;padding:48px 20px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:-.6px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  a.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;
         padding:18px;text-decoration:none;color:inherit;transition:.15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .emoji{font-size:30px}
  .name{font-weight:700;margin:8px 0 4px;font-size:15px}
  .desc{color:var(--dim);font-size:12.5px;line-height:1.5}
  .tag{display:inline-block;margin-top:10px;font-size:11px;color:var(--accent);
       border:1px solid rgba(94,225,160,.3);border-radius:99px;padding:2px 9px}
  .soon{opacity:.45;border-style:dashed;cursor:default}
  .soon:hover{border-color:var(--line);transform:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 HTML 게임 모음</h1>
  <p class="sub">브라우저에서 바로 돌아가는 1인 개발 플래시게임들</p>
  <div class="grid">
    <a class="card" href="leave-on-time/index.html">
      <div class="emoji">🚌</div>
      <div class="name">퇴근 스쿨버스</div>
      <div class="desc">엘리베이터 도착 전까지 칼퇴해라! 15층 오피스에서 팀장 시야를 피해 퇴근 준비를 끝내고 엘베 앞에 서라. 빠를수록 고득점. 레벨이 오를수록 할 일은 늘고 마감은 짧아진다.</div>
      <span class="tag">픽셀 스텔스 · 점수제 · 타이핑</span>
    </a>
    <div class="card soon">
      <div class="emoji">➕</div>
      <div class="name">다음 게임</div>
      <div class="desc">여기에 계속 추가</div>
    </div>
  </div>
  <p style="margin-top:28px;font-size:11.5px;color:#6b7386;line-height:1.8">
    애셋 — 가구 <b style="color:#8b94a8">Free Furniture Office Equipment Set</b> by Antea (CC BY 4.0) ·
    캐릭터 <b style="color:#8b94a8">Free Pixel Characters Pack</b> by Kettoman
  </p>
</div>
</body>
</html>
